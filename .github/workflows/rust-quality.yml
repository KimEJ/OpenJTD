name: Rust Quality

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'rjtd/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/**'
      - 'scripts/ci-*.sh'
  push:
    branches: [dev, main]
    paths:
      - 'rjtd/**'
      - 'LICENSE'
      - 'THIRD_PARTY.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/**'
      - 'scripts/ci-*.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rjtd

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (was v4)
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (was v4)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rjtd/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Record toolchain versions
        run: |
          rustc -Vv
          cargo -V

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --locked

      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build workspace documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Check WebAssembly target
        run: cargo check --package rjtd-wasm --target wasm32-unknown-unknown --locked

      - name: Inspect publishable package contents
        run: bash ../scripts/ci-verify-packages.sh

      - name: Verify LICENSE copies
        run: bash ../scripts/ci-verify-license-copies.sh

      - name: Verify WASM distribution notices
        run: bash ../scripts/ci-verify-wasm-distribution-notices.sh

      - name: Install cargo-audit
        run: |
          cargo install --locked --version 0.22.2 cargo-audit --root "$RUNNER_TEMP/cargo-audit"
          echo "$RUNNER_TEMP/cargo-audit/bin" >> "$GITHUB_PATH"

      - name: Audit locked dependencies
        run: cargo audit --deny unsound --file Cargo.lock

  msrv:
    name: msrv-1.88.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rjtd

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (was v4)
        with:
          persist-credentials: false

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.88.0

      - name: Cache Cargo downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (was v4)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('rjtd/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check MSRV workspace
        run: cargo check --workspace --locked
