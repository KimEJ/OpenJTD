name: Deploy Viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'rjtd/crates/rjtd-wasm/**'
      - 'rjtd/crates/rjtd-core/**'
      - 'rjtd/crates/rjtd-model/**'
      - 'rjtd/Cargo.toml'
      - 'rjtd/Cargo.lock'
      - 'openjtd.github.io/**'
      - '.github/workflows/deploy-viewer.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (was v4)
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (was v4)
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rjtd/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('rjtd/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-wasm-

      - name: Install pinned wasm-pack
        run: |
          wasm_pack_dir="$(bash scripts/ci-install-wasm-pack.sh)"
          printf '%s\n' "$wasm_pack_dir" >> "$GITHUB_PATH"

      - name: Build WASM
        run: wasm-pack build --target web rjtd/crates/rjtd-wasm

      - name: Replace viewer package
        run: |
          rm -rf openjtd.github.io/pkg
          mkdir -p openjtd.github.io/pkg
          cp -a rjtd/crates/rjtd-wasm/pkg/. openjtd.github.io/pkg/
          test -f openjtd.github.io/pkg/package.json
          test -f openjtd.github.io/pkg/rjtd_wasm.js
          test -s openjtd.github.io/pkg/rjtd_wasm_bg.wasm
          test ! -e openjtd.github.io/pkg/pkg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0 (was v5)

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0 (was v4)
        with:
          path: openjtd.github.io

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5 (was v4)
